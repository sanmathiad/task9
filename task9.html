<!DOCTYPE html>
<html>
<head>
  <title>SpendSmart</title>
  <link rel="stylesheet" href="task9.css">
</head>
<body>

  <h2>SpendSmart</h2>
  <div>
    <input type="number" id="budgetInput" placeholder="Budget ₹">
    <button onclick="setBudget()">Set</button>
  </div>

  <form id="expForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="number" id="amt" placeholder="Amount ₹" required>
    <select id="cat">
      <option value="Food">Food</option>
      <option value="Travel">Travel</option>
      <option value="Shopping">Shopping</option>
      <option value="Other">Other</option>
    </select>
    <input type="date" id="date" required>
    <button type="submit">Add</button>
  </form>

  <p>Spent: <b id="spent">₹0</b> | Remaining: <b id="left">₹0</b></p>
  <p id="warn" class="warning"></p>


  <button onclick="clearAll()">Clear All</button>
  <button onclick="exportJSON()">Export JSON</button>
  <input type="file" accept=".json" onchange="importJSON(event)">

  <h3>Expenses List</h3>
  <input type="text" id="search" oninput="showData()" placeholder="Search...">
  <select id="filterCat" onchange="showData()">
    <option value="All">All</option>
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Other">Other</option>
  </select>

  <ul id="expList"></ul>

  <script src="task9.js"></script>
</body>
</html>
